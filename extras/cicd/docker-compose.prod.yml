# Заготовка CD (в курсе пока не используется): production-вариант на облачной ВМ.
# Бэкенд больше НЕ собирается на сервере — берём готовый образ из registry (GHCR).
# Наружу открыт только Nginx (порт 80). Бэкенд, БД и кэш — во внутренней сети.
# Базовые образы (nginx, postgres, redis) берём из нашего GHCR — это копии из Docker Hub,
# который из России работает нестабильно (см. workflow mirror-images).

name: devops-lab          # то же имя проекта, что и в lesson09: на сервере стек заменяется, данные в томе сохраняются

services:
  nginx:
    image: ghcr.io/tenroman1-design/devops-lab/nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend-net]
    depends_on: [backend]
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE, e.g. ghcr.io/owner/repo/backend:latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-appdb}
      REDIS_URL: redis://cache:6379/0
      APP_VERSION: ${APP_VERSION:-prod}
    networks: [frontend-net, backend-net]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: ghcr.io/tenroman1-design/devops-lab/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cache:
    image: ghcr.io/tenroman1-design/devops-lab/redis:7-alpine
    networks: [backend-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  frontend-net:   # nginx <-> backend
  backend-net:    # backend <-> db, cache (nginx сюда не видит)

volumes:
  pgdata:
