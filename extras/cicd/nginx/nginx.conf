# Nginx как reverse proxy (L7) перед бэкендом.
#
# Почему в upstream ОДНА строка, хотя реплик может быть несколько:
#  - nginx ходит к бэкенду по внутренней сети Docker, а не через порты хоста;
#  - каждая реплика — отдельный контейнер со своим IP и слушает один и тот же порт 8000;
#  - имя "backend" (имя сервиса в compose) встроенный DNS Docker превращает
#    в список IP всех реплик: при --scale backend=3 это 3 адреса.
# Порты хоста вида "8000-8005:8000" (занятие 8) нужны только для доступа с ноутбука,
# nginx их не использует — поэтому у бэкенда здесь вообще нет "ports".
upstream backend_pool {
    zone backend_pool 64k;                   # общая память — нужна для resolve
    resolver 127.0.0.11 valid=5s ipv6=off;   # встроенный DNS Docker
    server backend:8000 resolve;             # перечитывать список IP каждые 5 с:
                                             # новые реплики подхватываются без перезапуска nginx
}

server {
    listen 80;
    server_name _;

    # Не показываем версию nginx наружу
    server_tokens off;

    location / {
        proxy_pass http://backend_pool;

        # Передаём бэкенду информацию об исходном запросе
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
    }

    # Health-check самого прокси (удобно для мониторинга)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}

