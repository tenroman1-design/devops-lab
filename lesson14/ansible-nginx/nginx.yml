---
- name: Install and configure Nginx
  hosts: web
  become: true

  tasks:

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Validate nginx

    - name: Configure nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/docker-app
        owner: root
        group: root
        mode: '0644'
        content: |
          server {
              listen 192.168.8.247:80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:80;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Student-Name "Den Mareev";
              }
               location = /health {
                  access_log off;
                  return 200 "ok\n";
              }
          }
      notify:  Validate nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/docker-app
        dest: /etc/nginx/sites-enabled/docker-app
        state: link
      notify: Validate nginx

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Validate nginx


    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Validate nginx
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: true
      notify: Restart nginx

    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted