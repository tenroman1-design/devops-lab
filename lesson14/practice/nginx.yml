---
- name: Deploy Nginx reverse proxy
  hosts: web
  become: true

  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Ensure Docker binds only to localhost
      ansible.builtin.lineinfile:
        path: /opt/devops-lab/lesson09/docker-compose.yml
        regexp: '^\s*-\s*"\$\{HTTP_PORT:-80\}:80"'
        line: '      - "127.0.0.1:${HTTP_PORT:-80}:80"'
      register: docker_config

    - name: Restart Docker Compose to apply port changes
      ansible.builtin.command: docker compose up -d
      args:
        chdir: /opt/devops-lab/lesson09
      when: docker_config.changed

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Configure nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/docker-app
        owner: root
        group: root
        mode: '0644'
        content: |
          server {
              listen {{ ansible_facts['default_ipv4']['address'] }}:80;
              server_name _;

              location /health {
                  default_type text/plain;
                  return 200 "OK";
              }

              location / {
                  proxy_pass http://127.0.0.1:80;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Student-Name "Yana Churina";
              }
          }
      notify: Restart nginx

    - name: Enable nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/docker-app
        dest: /etc/nginx/sites-enabled/docker-app
        state: link
      notify: Restart nginx

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart nginx

    - name: Check nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted