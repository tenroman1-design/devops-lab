name: lesson16-logging

services:
  loki:
    image: grafana/loki:3.5.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      default:
      monitoring:
        aliases:
          - lesson16-loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    command: run /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  app:
    image: python:3.12-slim
    working_dir: /app
    command: python -u app.py
    volumes:
      - ./app/app.py:/app/app.py:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging: "enabled"
    restart: unless-stopped

volumes:
  loki-data:

networks:
  monitoring:
    external: true
    name: ${MONITORING_NETWORK:-practice_default}
